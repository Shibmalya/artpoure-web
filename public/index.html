<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARTPOURE • Haute Ethnic Editorial</title>
    <meta name="description" content="Artpoure bespoke handwoven Banarasi, Kanjeevaram silk sarees & couture ethnic wear.">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
</head>
<body>

    <!-- Ambient Looping Video Background Layer -->
    <div class="ambient-background" id="ambientBackground">
        <video class="ambient-video" id="ambientVideo" autoplay loop muted playsinline poster="https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=1600&q=80">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-curtain-of-golden-silk-blowing-in-the-wind-41551-large.mp4" type="video/mp4">
        </video>
        <div class="ambient-scrim"></div>
    </div>

    <!-- Cascading Floating Header (Synchronized Multi-Layer Physics) -->
    <header class="header-wrapper" id="headerWrapper">
        <!-- Layer 1: Pinned Brand Layer (Morphs into floating pill on scroll) -->
        <div class="brand-layer">
            <div class="brand-container" id="brandContainer">
                <span class="brand-title">ARTPOURE</span>
                <span class="brand-tagline">HAUTE ETHNIC EDITORIAL</span>
            </div>

            <!-- Action Buttons -->
            <div class="action-icons" id="actionIcons">
                <!-- Search Toggle -->
                <button class="icon-btn" id="searchToggleBtn" title="Search Catalog">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>

                <!-- Theme Mode Toggle -->
                <button class="icon-btn" id="themeToggleBtn" title="Toggle Theme">
                    <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>

                <!-- Wishlist Button -->
                <button class="icon-btn" id="wishlistHeaderBtn" title="Wishlist">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    <span class="badge" id="wishlistBadge">0</span>
                </button>
            </div>
        </div>

        <!-- Layer 2: Location Delivery Bar -->
        <div class="location-layer" id="locationLayer">
            <div class="location-pill" id="locationPill">
                <div class="location-left">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    <span class="location-label">Delivering to</span>
                    <span style="opacity: 0.5;">•</span>
                    <span class="location-value" id="currentAddress">289, Horamavu, Bengaluru</span>
                </div>
                <div class="location-change-tag">
                    <span>Change</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
            </div>

            <!-- Expandable Search Input -->
            <div class="search-bar-container" id="searchContainer">
                <input type="text" class="search-input" id="searchInput" placeholder="Search Banarasi, Kundan, Anarkali...">
            </div>
        </div>

        <!-- Layer 3: Category Pills Filter Row -->
        <div class="categories-layer" id="categoriesLayer">
            <div class="categories-scroll" id="categoryChips">
                <button class="category-chip active" data-category="ALL">ALL</button>
                <button class="category-chip" data-category="SAREES">SAREES</button>
                <button class="category-chip" data-category="CLOTHES">CLOTHES</button>
                <button class="category-chip" data-category="JEWELLERY">JEWELLERY</button>
            </div>
        </div>
    </header>

    <!-- Main Editorial Feed -->
    <main class="main-content">

        <!-- 2026 Editorial Hero Showcase (Auto-Cycling with Animated Indicator Pills) -->
        <section class="hero-showcase">
            <div class="hero-card" id="heroCard">
                <div class="hero-top-meta">
                    <span><span style="color: var(--accent-gold); margin-right: 4px;">●</span> NEW ARRIVALS • 2026 EDITORIAL</span>
                    <span id="heroPageCounter">01 / 04</span>
                </div>
                <div class="hero-image-wrap">
                    <img class="hero-model-img" id="heroModelImg" src="https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?auto=format&fit=crop&w=800&q=80" alt="Editorial Showcase">
                </div>
                <div class="hero-info">
                    <h1 class="hero-large-title" id="heroTitle">ANARKALI</h1>
                    <p class="hero-sub" id="heroSub">PURE SILK CHIFFON • 3 PIECE SUITE</p>
                    <p class="hero-price" id="heroPrice">₹16,999</p>
                    <button class="hero-btn" id="heroCtaBtn">EXPLORE EDITORIAL</button>
                </div>
            </div>

            <!-- Animated Indicator Pills matching Android Jetpack Compose -->
            <div class="hero-indicators" id="heroIndicators">
                <!-- Dynamically populated by app.js -->
            </div>
        </section>

        <!-- Curated Collection Header Row matching Android HomeScreen -->
        <div class="collection-header-row">
            <span class="collection-header-title">CURATED COLLECTION</span>
            <span class="collection-header-count" id="collectionCount">4 PIECES</span>
        </div>

        <!-- Product Grid (Responsive 2 / 3 / 4 columns) -->
        <section class="product-grid" id="productGrid">
            <!-- Dynamically populated by app.js from Firestore -->
        </section>
    </main>

    <!-- Modern Floating Pill Bottom Navigation Panel -->
    <div class="bottom-nav-container">
        <div class="bottom-nav-pill" id="bottomNavPill">
            <button class="nav-tab active" id="collectionTab">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span class="nav-tab-label">COLLECTION</span>
            </button>
            <button class="nav-tab" id="cartTab">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                <span class="nav-tab-label">BAG</span>
                <span class="badge" id="cartBadge">0</span>
            </button>
        </div>
    </div>

    <!-- Slide-out Cart Drawer -->
    <div class="cart-drawer-overlay" id="cartDrawerOverlay">
        <div class="cart-drawer">
            <div class="drawer-header">
                <h3 class="drawer-title">SHOPPING BAG</h3>
                <button class="icon-btn" id="closeCartBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="drawer-items" id="cartItemsList">
                <!-- Dynamically rendered cart items -->
            </div>
            <div class="drawer-footer">
                <div style="display: flex; justify-content: space-between; margin-bottom: 16px; font-weight: 700;">
                    <span>TOTAL</span>
                    <span id="cartTotalSum">₹0</span>
                </div>
                <button class="checkout-btn" id="proceedCheckoutBtn">PROCEED TO CHECKOUT</button>
            </div>
        </div>
    </div>

    <!-- Modular Application Logic -->
    <script type="module" src="app.js"></script>
</body>
</html>
